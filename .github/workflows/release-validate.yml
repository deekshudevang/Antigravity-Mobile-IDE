name: Release Validation CI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Verify Release Metadata & Version Sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify SemVer synchronization
        run: node scripts/check-version-sync.mjs

      - name: Run all Node tests
        run: npm test

      - name: Verify SEO & Web manifests
        run: node scripts/seo-audit.mjs

      - name: Verify WCAG contrast ratios
        run: node scripts/check-contrast.mjs
