name: Rust CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'rust-helper/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'rust-helper/**'
      - '.github/workflows/rust.yml'

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-test:
    name: Rust Helper Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo check
        run: cargo check --manifest-path rust-helper/Cargo.toml

      - name: Run cargo test
        run: cargo test --manifest-path rust-helper/Cargo.toml
