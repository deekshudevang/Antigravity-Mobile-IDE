version: 2
updates:
  # Maintain dependencies for npm backend
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Maintain dependencies for Android Gradle project
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain dependencies for Rust helper
  - package-ecosystem: "cargo"
    directory: "/rust-helper"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
