name: Documentation Feedback
description: Report an error, broken link, or missing guide in documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation Issue
      description: Which page or section contains an error, broken link, or missing detail?
    validations:
      required: true
  - type: textarea
    id: suggested_change
    attributes:
      label: Suggested Change
      description: What should the documentation say instead?
    validations:
      required: true
