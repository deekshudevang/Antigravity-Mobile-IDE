<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#007799"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#090C12"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="2"/>
  
  <!-- Outer orbital ring (remote link) -->
  <circle cx="50" cy="50" r="32" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-dasharray="6 4" stroke-opacity="0.8"/>
  
  <!-- Mobile device silhouette frame -->
  <rect x="36" y="26" width="28" height="48" rx="6" stroke="#E5E7EB" stroke-width="2.5" fill="#111827"/>
  <!-- Screen display area -->
  <rect x="39" y="32" width="22" height="34" rx="2" fill="#0A0E17"/>
  <!-- Status dot inside screen (active turn) -->
  <circle cx="50" cy="42" r="3" fill="#00E5FF"/>
  <!-- Terminal prompt pulse -->
  <line x1="43" y1="52" x2="57" y2="52" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="58" x2="51" y2="58" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <!-- Home indicator -->
  <line x1="46" y1="70" x2="54" y2="70" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
</svg>
